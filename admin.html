<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bandhan - Admin Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <!-- Top Navigation -->
    <nav class="top-nav">
        <div class="brand">
            <span>बंधन</span>
            <span style="font-weight: normal; font-size: 14px; opacity: 0.8;">Admin Panel</span>
        </div>
        <div class="nav-actions">
            <button onclick="logout()" title="Logout">🚪</button>
        </div>
    </nav>
    
    <!-- Tab Navigation -->
    <nav class="tab-nav" id="tabNav">
        <a class="tab-item active" data-tab="all" onclick="showTab('all')">👥 All Profiles</a>
        <a class="tab-item" data-tab="pending" onclick="showTab('pending')">⏳ Pending <span class="badge" id="pendingBadge">0</span></a>
        <a class="tab-item" data-tab="stats" onclick="showTab('stats')">📊 Stats</a>
        <a class="tab-item" data-tab="users" onclick="showTab('users')">👤 Users</a>
    </nav>
    
    <!-- Tab Content -->
    <div class="container">
        <!-- ALL PROFILES TAB -->
        <div class="tab-content active" id="tab-all">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <h3>All Profiles</h3>
                <button class="btn btn-primary" onclick="showCreateUserDialog()">➕ Create User</button>
            </div>
            <div id="allProfilesContent">
                <div class="loading-state"><div class="spinner"></div><p>Loading profiles...</p></div>
            </div>
        </div>
        
        <!-- PENDING PROFILES TAB -->
        <div class="tab-content" id="tab-pending">
            <h3 style="margin-bottom: 12px;">⏳ Pending Approval</h3>
            <div id="pendingProfilesContent">
                <div class="loading-state"><div class="spinner"></div><p>Loading pending profiles...</p></div>
            </div>
        </div>
        
        <!-- STATS TAB -->
        <div class="tab-content" id="tab-stats">
            <h3 style="margin-bottom: 12px;">📊 Dashboard Stats</h3>
            <div id="statsContent">
                <div class="loading-state"><div class="spinner"></div><p>Loading stats...</p></div>
            </div>
        </div>
        
        <!-- USERS TAB -->
        <div class="tab-content" id="tab-users">
            <h3 style="margin-bottom: 12px;">👤 Users Management</h3>
            <div id="usersContent">
                <div class="loading-state"><div class="spinner"></div><p>Loading users...</p></div>
            </div>
        </div>
    </div>
    
    <!-- Create User Modal -->
    <div id="createUserModal" class="modal-overlay" style="display: none;">
        <div class="modal">
            <div class="modal-header">
                <h3>👤 Create User + Profile</h3>
                <button class="modal-close" onclick="closeCreateUserDialog()">×</button>
            </div>
            <div id="createUserForm">
                <div class="form-group">
                    <label>Full Name *</label>
                    <input type="text" id="cuName" class="form-control" placeholder="Full name">
                </div>
                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" id="cuEmail" class="form-control" placeholder="your@email.com">
                </div>
                <div class="form-group">
                    <label>Mobile Number</label>
                    <input type="tel" id="cuMobile" class="form-control" placeholder="Optional">
                </div>
                <div class="form-group">
                    <label>Gender *</label>
                    <input type="text" id="cuGender" class="form-control" placeholder="Male/Female">
                </div>
                <div class="form-group">
                    <label>Role *</label>
                    <input type="text" id="cuRole" class="form-control" placeholder="USER/ADMIN" value="USER">
                </div>
                <div class="form-group">
                    <label>Password *</label>
                    <input type="password" id="cuPassword" class="form-control" placeholder="Min 6 characters">
                </div>
                <div class="form-group">
                    <label>Confirm Password *</label>
                    <input type="password" id="cuConfirmPassword" class="form-control" placeholder="Re-enter password">
                </div>
                <div id="cuError" style="color: var(--error); font-size: 14px; margin-bottom: 8px; display: none;"></div>
                <div class="modal-footer">
                    <button class="btn btn-outline" onclick="closeCreateUserDialog()">Cancel</button>
                    <button class="btn btn-primary" onclick="createUser()">Create User</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Edit User Modal -->
    <div id="editUserModal" class="modal-overlay" style="display: none;">
        <div class="modal">
            <div class="modal-header">
                <h3>✏️ Edit User</h3>
                <button class="modal-close" onclick="closeEditUserDialog()">×</button>
            </div>
            <div id="editUserForm">
                <input type="hidden" id="euDocId">
                <div class="form-group">
                    <label>Full Name *</label>
                    <input type="text" id="euName" class="form-control" placeholder="Full name">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="euEmail" class="form-control" placeholder="Email" disabled>
                    <small style="color: var(--text-secondary);">Email cannot be changed</small>
                </div>
                <div class="form-group">
                    <label>Mobile Number</label>
                    <input type="tel" id="euMobile" class="form-control" placeholder="Mobile number">
                </div>
                <div class="form-group">
                    <label>Role *</label>
                    <select id="euRole" class="form-control">
                        <option value="USER">USER</option>
                        <option value="ADMIN">ADMIN</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Account Status</label>
                    <select id="euStatus" class="form-control">
                        <option value="ACTIVE">ACTIVE</option>
                        <option value="INACTIVE">INACTIVE</option>
                    </select>
                </div>
                <div id="euError" style="color: var(--error); font-size: 14px; margin-bottom: 8px; display: none;"></div>
                <div class="modal-footer">
                    <button class="btn btn-outline" onclick="closeEditUserDialog()">Cancel</button>
                    <button class="btn btn-primary" onclick="saveUserEdit()">💾 Save Changes</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="js/firebase-config.js"></script>
    <script src="js/app.js"></script>
    <script>
        // ============================================
        // INIT ADMIN PAGE
        // ============================================
        
        async function initAdminPage() {
            const user = auth.currentUser;
            if (!user) {
                window.location.href = 'index.html';
                return;
            }
            
            // Verify admin
            const admin = await isAdmin();
            if (!admin) {
                showToast('Access denied. Admin only.', 'error');
                window.location.href = 'dashboard.html';
                return;
            }
            
            // Load all data
            await loadAllProfiles();
            await loadPendingProfiles();
            await loadStats();
            await loadUsers();
        }
        
        // ============================================
        // LOAD ALL PROFILES
        // ============================================
        
        async function loadAllProfiles() {
            const container = document.getElementById('allProfilesContent');
            container.innerHTML = '<div class="loading-state"><div class="spinner"></div><p>Loading profiles...</p></div>';
            
            try {
                const snapshot = await db.collection('profiles').limit(100).get();
                
                if (snapshot.empty) {
                    container.innerHTML = '<div class="empty-state"><div class="icon">👤</div><h4>No profiles found</h4></div>';
                    return;
                }
                
                let html = '';
                snapshot.forEach(doc => {
                    const p = { id: doc.id, ...doc.data() };
                    html += createAdminProfileCard(p);
                });
                container.innerHTML = html;
            } catch (error) {
                container.innerHTML = `<div class="card" style="color: var(--error);">Error: ${error.message}</div>`;
            }
        }
        
        function createAdminProfileCard(profile) {
            const name = `${profile['First Name'] || ''} ${profile['Last Name'] || ''}`.trim() || 'Unknown';
            const age = profile.Age || '?';
            const city = profile.City || '';
            const state = profile.State || '';
            const gender = profile.Gender || '';
            const community = profile.Community || '';
            const status = profile['Profile Status'] || 'PENDING';
            const email = profile.email || '';
            const photo = profile['Profile Photo'] || '';
            const docId = emailToDocumentId(email);
            
            const statusColor = status === 'APPROVED' ? 'var(--success)' : status === 'REJECTED' ? 'var(--error)' : 'var(--warning)';
            
            const photoHTML = photo ? 
                `<img src="${photo}" alt="${name}" style="width: 60px; height: 60px; border-radius: 50%; object-fit: cover;">` :
                `<div style="width: 60px; height: 60px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700;">${name.charAt(0).toUpperCase()}</div>`;
            
            const detailUrl = `profile-detail.html?email=${encodeURIComponent(email)}`;
            
            return `
                <div class="card">
                    <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
                        ${photoHTML}
                        <div style="flex: 1; min-width: 150px;">
                            <div style="font-weight: 600;">${name}, ${age}</div>
                            <div style="font-size: 13px; color: var(--text-secondary);">
                                ${city ? `📍 ${city}${state ? ', ' + state : ''}` : ''}
                                ${gender ? ` • ${gender}` : ''}
                                ${community ? ` • ${community}` : ''}
                            </div>
                            <div style="font-size: 12px; color: var(--text-secondary);">${email}</div>
                        </div>
                        <div style="display: flex; gap: 4px; flex-wrap: wrap;">
                            <span style="font-size: 11px; padding: 2px 8px; border-radius: 12px; background: ${statusColor}20; color: ${statusColor}; font-weight: 500;">${status}</span>
                        </div>
                        <div style="display: flex; gap: 4px; flex-wrap: wrap;">
                            <button class="btn btn-outline" onclick="window.location.href='${detailUrl}'" style="padding: 4px 8px; font-size: 12px;">👁️</button>
                            <button class="btn btn-primary" onclick="window.location.href='edit-profile.html?docId=${docId}'" style="padding: 4px 8px; font-size: 12px;">✏️</button>
                            <button class="btn btn-secondary" onclick="window.location.href='gallery-management.html?docId=${docId}'" style="padding: 4px 8px; font-size: 12px;">🖼️</button>
                            <button class="btn btn-danger" onclick="deleteProfile('${docId}')" style="padding: 4px 8px; font-size: 12px;">🗑️</button>
                        </div>
                    </div>
                </div>
            `;
        }
        
        // ============================================
        // LOAD PENDING PROFILES
        // ============================================
        
        async function loadPendingProfiles() {
            const container = document.getElementById('pendingProfilesContent');
            container.innerHTML = '<div class="loading-state"><div class="spinner"></div><p>Loading pending profiles...</p></div>';
            
            try {
                const snapshot = await db.collection('profiles')
                    .where('Profile Status', '==', 'PENDING')
                    .get();
                
                document.getElementById('pendingBadge').textContent = snapshot.size;
                
                if (snapshot.empty) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">✅</div>
                            <h4>No pending profiles</h4>
                            <p style="color: var(--text-secondary);">All profiles have been reviewed</p>
                        </div>
                    `;
                    return;
                }
                
                let html = '';
                snapshot.forEach(doc => {
                    const p = { id: doc.id, ...doc.data() };
                    html += createPendingProfileCard(p);
                });
                container.innerHTML = html;
            } catch (error) {
                container.innerHTML = `<div class="card" style="color: var(--error);">Error: ${error.message}</div>`;
            }
        }
        
        function createPendingProfileCard(profile) {
            const name = `${profile['First Name'] || ''} ${profile['Last Name'] || ''}`.trim() || 'Unknown';
            const age = profile.Age || '?';
            const city = profile.City || '';
            const state = profile.State || '';
            const gender = profile.Gender || '';
            const community = profile.Community || '';
            const email = profile.email || '';
            const photo = profile['Profile Photo'] || '';
            
            const photoHTML = photo ? 
                `<img src="${photo}" alt="${name}" style="width: 50px; height: 50px; border-radius: 50%; object-fit: cover;">` :
                `<div style="width: 50px; height: 50px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700;">${name.charAt(0).toUpperCase()}</div>`;
            
            return `
                <div class="card">
                    <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
                        ${photoHTML}
                        <div style="flex: 1; min-width: 150px;">
                            <div style="font-weight: 600;">${name}, ${age}</div>
                            <div style="font-size: 13px; color: var(--text-secondary);">
                                ${gender}${community ? ` • ${community}` : ''}
                                ${city ? ` • ${city}${state ? ', ' + state : ''}` : ''}
                            </div>
                            <div style="font-size: 12px; color: var(--text-secondary);">${email}</div>
                        </div>
                        <div style="display: flex; gap: 4px; flex-wrap: wrap;">
                            <button class="btn btn-outline" onclick="window.location.href='profile-detail.html?email=${encodeURIComponent(email)}'" style="padding: 4px 8px; font-size: 12px;">👁️</button>
                            <button class="btn btn-success" onclick="approveProfile('${emailToDocumentId(email)}')" style="padding: 4px 8px; font-size: 12px;">✅ Approve</button>
                            <button class="btn btn-danger" onclick="rejectProfile('${emailToDocumentId(email)}')" style="padding: 4px 8px; font-size: 12px;">❌ Reject</button>
                        </div>
                    </div>
                </div>
            `;
        }
        
        // ============================================
        // APPROVE / REJECT
        // ============================================
        
        async function approveProfile(docId) {
            try {
                await db.collection('profiles').doc(docId).update({
                    'Profile Status': 'APPROVED',
                    updatedAt: Date.now()
                });
                showToast('✅ Profile approved!', 'success');
                await loadPendingProfiles();
                await loadAllProfiles();
                await loadStats();
            } catch (error) {
                showToast('Error: ' + error.message, 'error');
            }
        }
        
        async function rejectProfile(docId) {
            try {
                await db.collection('profiles').doc(docId).update({
                    'Profile Status': 'REJECTED',
                    updatedAt: Date.now()
                });
                showToast('❌ Profile rejected', 'warning');
                await loadPendingProfiles();
                await loadAllProfiles();
                await loadStats();
            } catch (error) {
                showToast('Error: ' + error.message, 'error');
            }
        }
        
        async function deleteProfile(docId) {
            if (!confirm('Are you sure you want to delete this profile permanently?')) return;
            
            try {
                await db.collection('profiles').doc(docId).delete();
                showToast('Profile deleted successfully', 'success');
                await loadAllProfiles();
                await loadStats();
            } catch (error) {
                showToast('Error: ' + error.message, 'error');
            }
        }
        
        // ============================================
        // LOAD STATS
        // ============================================
        
        async function loadStats() {
            const container = document.getElementById('statsContent');
            container.innerHTML = '<div class="loading-state"><div class="spinner"></div><p>Loading stats...</p></div>';
            
            try {
                // Get all profiles
                const profileSnapshot = await db.collection('profiles').get();
                let total = 0, approved = 0, pending = 0, rejected = 0, brides = 0, grooms = 0;
                
                profileSnapshot.forEach(doc => {
                    const data = doc.data();
                    total++;
                    const status = data['Profile Status'] || '';
                    if (status === 'APPROVED') approved++;
                    else if (status === 'PENDING') pending++;
                    else if (status === 'REJECTED') rejected++;
                    
                    const gender = (data.Gender || '').toLowerCase();
                    if (gender === 'female') brides++;
                    else if (gender === 'male') grooms++;
                });
                
                // Get users
                const userSnapshot = await db.collection('users')
                    .where('accountStatus', '==', 'ACTIVE')
                    .get();
                const totalUsers = userSnapshot.size;
                
                // Get favorites
                const favSnapshot = await db.collection('shortlist').get();
                const totalFavorites = favSnapshot.size;
                
                container.innerHTML = `
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-icon">👥</div>
                            <div class="stat-value">${totalUsers}</div>
                            <div class="stat-label">Total Users</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon">👤</div>
                            <div class="stat-value">${total}</div>
                            <div class="stat-label">Total Profiles</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon">✅</div>
                            <div class="stat-value">${approved}</div>
                            <div class="stat-label">Approved</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon">⏳</div>
                            <div class="stat-value">${pending}</div>
                            <div class="stat-label">Pending</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon">❌</div>
                            <div class="stat-value">${rejected}</div>
                            <div class="stat-label">Rejected</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon">👰</div>
                            <div class="stat-value">${brides}</div>
                            <div class="stat-label">Brides</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon">🤵</div>
                            <div class="stat-value">${grooms}</div>
                            <div class="stat-label">Grooms</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon">❤️</div>
                            <div class="stat-value">${totalFavorites}</div>
                            <div class="stat-label">Favorites</div>
                        </div>
                    </div>
                    <button class="btn btn-primary" onclick="loadStats()" style="margin-top: 8px;">🔄 Refresh</button>
                `;
            } catch (error) {
                container.innerHTML = `<div class="card" style="color: var(--error);">Error: ${error.message}</div>`;
            }
        }
        
        // ============================================
        // LOAD USERS
        // ============================================
        
        async function loadUsers() {
            const container = document.getElementById('usersContent');
            container.innerHTML = '<div class="loading-state"><div class="spinner"></div><p>Loading users...</p></div>';
            
            try {
                const snapshot = await db.collection('users').get();
                
                if (snapshot.empty) {
                    container.innerHTML = '<div class="empty-state"><div class="icon">👤</div><h4>No users found</h4></div>';
                    return;
                }
                
                let html = '';
                snapshot.forEach(doc => {
                    const u = { id: doc.id, ...doc.data() };
                    html += createUserCard(u);
                });
                container.innerHTML = html;
            } catch (error) {
                container.innerHTML = `<div class="card" style="color: var(--error);">Error: ${error.message}</div>`;
            }
        }
        
        function createUserCard(user) {
            const statusColor = user.accountStatus === 'ACTIVE' ? 'var(--success)' : 'var(--warning)';
            const isActive = user.accountStatus === 'ACTIVE';
            const isAdminUser = user.role === 'ADMIN';
            
            return `
                <div class="card">
                    <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
                        <div style="width: 50px; height: 50px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; flex-shrink: 0;">
                            ${(user.name || 'U').charAt(0).toUpperCase()}
                        </div>
                        <div style="flex: 1; min-width: 150px;">
                            <div style="font-weight: 600;">${user.name || 'Unknown'}</div>
                            <div style="font-size: 13px; color: var(--text-secondary);">${user.email}</div>
                            <div style="font-size: 12px; color: var(--text-secondary);">📱 ${user.mobile || 'N/A'}</div>
                        </div>
                        <div style="display: flex; gap: 4px; flex-wrap: wrap;">
                            <span style="font-size: 11px; padding: 2px 8px; border-radius: 12px; background: ${statusColor}20; color: ${statusColor}; font-weight: 500;">${user.accountStatus || 'ACTIVE'}</span>
                            <span style="font-size: 11px; padding: 2px 8px; border-radius: 12px; background: ${isAdminUser ? '#FF980020' : '#2196F320'}; color: ${isAdminUser ? 'var(--warning)' : '#2196F3'}; font-weight: 500;">${user.role || 'USER'}</span>
                        </div>
                        <div style="display: flex; gap: 4px; flex-wrap: wrap;">
                            <button class="btn btn-outline" onclick="window.location.href='profile-detail.html?email=${encodeURIComponent(user.email)}'" style="padding: 4px 8px; font-size: 12px;">👁️</button>
                            <button class="btn btn-primary" onclick="showEditUserDialog('${user.id}')" style="padding: 4px 8px; font-size: 12px;">✏️</button>
                            ${isActive ? 
                                `<button class="btn btn-warning" onclick="deactivateUser('${user.id}')" style="padding: 4px 8px; font-size: 12px; background: var(--warning); color: white; border: none; border-radius: 4px; cursor: pointer;">⛔</button>` :
                                `<button class="btn btn-success" onclick="reactivateUser('${user.id}')" style="padding: 4px 8px; font-size: 12px;">✅</button>`
                            }
                            <button class="btn btn-danger" onclick="deleteUser('${user.id}')" style="padding: 4px 8px; font-size: 12px;">🗑️</button>
                        </div>
                    </div>
                </div>
            `;
        }
        
        // ============================================
        // USER MANAGEMENT
        // ============================================
        
        async function deactivateUser(docId) {
            if (!confirm('Deactivate this user? They will not be able to login.')) return;
            try {
                await db.collection('users').doc(docId).update({ accountStatus: 'INACTIVE' });
                showToast('User deactivated', 'warning');
                await loadUsers();
                await loadStats();
            } catch (error) {
                showToast('Error: ' + error.message, 'error');
            }
        }
        
        async function reactivateUser(docId) {
            if (!confirm('Reactivate this user?')) return;
            try {
                await db.collection('users').doc(docId).update({ accountStatus: 'ACTIVE' });
                showToast('User reactivated', 'success');
                await loadUsers();
                await loadStats();
            } catch (error) {
                showToast('Error: ' + error.message, 'error');
            }
        }
        
        async function deleteUser(docId) {
            if (!confirm('⚠️ PERMANENTLY delete this user? This cannot be undone!')) return;
            try {
                // Delete user document
                await db.collection('users').doc(docId).delete();
                // Delete profile if exists
                try {
                    await db.collection('profiles').doc(docId).delete();
                } catch (e) {}
                // Delete shortlist entries
                const shortlistSnapshot = await db.collection('shortlist')
                    .where('userId', '==', docId)
                    .get();
                shortlistSnapshot.forEach(doc => {
                    db.collection('shortlist').doc(doc.id).delete();
                });
                showToast('User deleted successfully', 'success');
                await loadUsers();
                await loadStats();
            } catch (error) {
                showToast('Error: ' + error.message, 'error');
            }
        }
        
        // ============================================
        // EDIT USER DIALOG
        // ============================================
        
        let editingUserId = null;
        let editingUserData = null;
        
        async function showEditUserDialog(docId) {
            editingUserId = docId;
            
            try {
                const doc = await db.collection('users').doc(docId).get();
                if (!doc.exists) {
                    showToast('User not found', 'error');
                    return;
                }
                
                editingUserData = { id: doc.id, ...doc.data() };
                
                // Populate form
                document.getElementById('euDocId').value = docId;
                document.getElementById('euName').value = editingUserData.name || '';
                document.getElementById('euEmail').value = editingUserData.email || '';
                document.getElementById('euMobile').value = editingUserData.mobile || '';
                document.getElementById('euRole').value = editingUserData.role || 'USER';
                document.getElementById('euStatus').value = editingUserData.accountStatus || 'ACTIVE';
                document.getElementById('euError').style.display = 'none';
                
                document.getElementById('editUserModal').style.display = 'flex';
            } catch (error) {
                showToast('Error loading user: ' + error.message, 'error');
            }
        }
        
        function closeEditUserDialog() {
            document.getElementById('editUserModal').style.display = 'none';
            editingUserId = null;
            editingUserData = null;
        }
        
        async function saveUserEdit() {
            const errorDiv = document.getElementById('euError');
            errorDiv.style.display = 'none';
            
            const name = document.getElementById('euName').value.trim();
            const mobile = document.getElementById('euMobile').value.trim();
            const role = document.getElementById('euRole').value;
            const status = document.getElementById('euStatus').value;
            const docId = document.getElementById('euDocId').value;
            
            if (!name) {
                errorDiv.textContent = 'Please enter full name';
                errorDiv.style.display = 'block';
                return;
            }
            
            const saveBtn = document.querySelector('#editUserForm .btn-primary');
            saveBtn.disabled = true;
            saveBtn.textContent = 'Saving...';
            
            try {
                const updateData = {
                    name: name,
                    mobile: mobile,
                    role: role,
                    accountStatus: status
                };
                
                await db.collection('users').doc(docId).update(updateData);
                
                showToast('✅ User updated successfully!', 'success');
                closeEditUserDialog();
                await loadUsers();
                await loadStats();
            } catch (error) {
                errorDiv.textContent = 'Error: ' + error.message;
                errorDiv.style.display = 'block';
                saveBtn.disabled = false;
                saveBtn.textContent = '💾 Save Changes';
            }
        }
        
        // ============================================
        // CREATE USER DIALOG
        // ============================================
        
        function showCreateUserDialog() {
            document.getElementById('createUserModal').style.display = 'flex';
            document.getElementById('cuError').style.display = 'none';
            document.querySelectorAll('#createUserForm input').forEach(el => el.value = '');
            document.getElementById('cuRole').value = 'USER';
        }
        
        function closeCreateUserDialog() {
            document.getElementById('createUserModal').style.display = 'none';
        }
        
        async function createUser() {
            const name = document.getElementById('cuName').value.trim();
            const email = document.getElementById('cuEmail').value.trim();
            const mobile = document.getElementById('cuMobile').value.trim();
            const gender = document.getElementById('cuGender').value.trim();
            const role = document.getElementById('cuRole').value.trim().toUpperCase();
            const password = document.getElementById('cuPassword').value;
            const confirm = document.getElementById('cuConfirmPassword').value;
            const errorDiv = document.getElementById('cuError');
            
            errorDiv.style.display = 'none';
            
            if (!name) { errorDiv.textContent = 'Please enter full name'; errorDiv.style.display = 'block'; return; }
            if (!email) { errorDiv.textContent = 'Please enter email'; errorDiv.style.display = 'block'; return; }
            if (!gender) { errorDiv.textContent = 'Please enter gender (Male/Female)'; errorDiv.style.display = 'block'; return; }
            if (!['MALE', 'FEMALE'].includes(gender.toUpperCase())) {
                errorDiv.textContent = 'Gender must be Male or Female';
                errorDiv.style.display = 'block';
                return;
            }
            if (!['USER', 'ADMIN'].includes(role)) {
                errorDiv.textContent = 'Role must be USER or ADMIN';
                errorDiv.style.display = 'block';
                return;
            }
            if (!password || password.length < 6) {
                errorDiv.textContent = 'Password must be at least 6 characters';
                errorDiv.style.display = 'block';
                return;
            }
            if (password !== confirm) {
                errorDiv.textContent = 'Passwords do not match';
                errorDiv.style.display = 'block';
                return;
            }
            
            try {
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;
                
                const emailKey = emailToDocumentId(email);
                
                // Create user document
                await db.collection('users').doc(emailKey).set({
                    email: email,
                    name: name,
                    mobile: mobile,
                    role: role,
                    accountStatus: 'ACTIVE',
                    hasProfile: true,
                    createdAt: Date.now(),
                    lastLogin: Date.now()
                });
                
                // Create profile
                const nameParts = name.split(' ');
                const firstName = nameParts[0] || '';
                const lastName = nameParts.slice(1).join(' ') || '';
                
                await db.collection('profiles').doc(emailKey).set({
                    'Profile For': 'Self',
                    'Gender': gender.charAt(0).toUpperCase() + gender.slice(1).toLowerCase(),
                    'First Name': firstName,
                    'Last Name': lastName,
                    'Date of Birth': '',
                    'Age': 0,
                    'Height (cm)': 0,
                    'Weight (kg)': 0,
                    'Marital Status': '',
                    'Mother Tongue': '',
                    'Community': '',
                    'Sub Community': '',
                    'City': '',
                    'State': '',
                    'Country': 'India',
                    'Profile Status': 'APPROVED',
                    'Education': '',
                    'Specialization': '',
                    'College': '',
                    'Occupation': '',
                    'Company': '',
                    'Job Type': '',
                    'Annual Income': '',
                    'Work Location': '',
                    'Profile Photo': '',
                    'galleryImages': [],
                    'Family Type': '',
                    'Family Status': '',
                    'Father Name': '',
                    'Father Occupation': '',
                    'Mother Name': '',
                    'Mother Occupation': '',
                    'Brothers': 0,
                    'Sisters': 0,
                    'Native Place': '',
                    'Expected Age From': 0,
                    'Expected Age To': 0,
                    'Expected Height From (cm)': 0,
                    'Expected Height To (cm)': 0,
                    'Preferred Education': [],
                    'Preferred Cities': [],
                    'Preferred Occupations': [],
                    'Income Expectation': '',
                    'Accept Divorce': '',
                    'Rashi': '',
                    'Nakshatra': '',
                    'Mangal': '',
                    'Phone': mobile,
                    'email': email,
                    'createdAt': Date.now(),
                    'updatedAt': Date.now()
                });
                
                showToast('✅ User and profile created successfully!', 'success');
                closeCreateUserDialog();
                await loadAllProfiles();
                await loadPendingProfiles();
                await loadStats();
                await loadUsers();
            } catch (error) {
                errorDiv.textContent = error.message || 'Failed to create user';
                errorDiv.style.display = 'block';
            }
        }
        
        // ============================================
        // INITIALIZE
        // ============================================
        
        document.addEventListener('DOMContentLoaded', function() {
            auth.onAuthStateChanged(user => {
                if (user) {
                    initAdminPage();
                } else {
                    window.location.href = 'index.html';
                }
            });
        });
        
        // Expose functions
        window.showCreateUserDialog = showCreateUserDialog;
        window.closeCreateUserDialog = closeCreateUserDialog;
        window.createUser = createUser;
        window.showEditUserDialog = showEditUserDialog;
        window.closeEditUserDialog = closeEditUserDialog;
        window.saveUserEdit = saveUserEdit;
        window.approveProfile = approveProfile;
        window.rejectProfile = rejectProfile;
        window.deleteProfile = deleteProfile;
        window.deactivateUser = deactivateUser;
        window.reactivateUser = reactivateUser;
        window.deleteUser = deleteUser;
        window.loadAllProfiles = loadAllProfiles;
        window.loadPendingProfiles = loadPendingProfiles;
        window.loadStats = loadStats;
        window.loadUsers = loadUsers;
    </script>
</body>
</html>
