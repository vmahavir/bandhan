<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bandhan - Profile Detail</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <nav class="top-nav">
        <div class="brand">
            <span>बंधन</span>
            <span style="font-weight: normal; font-size: 14px; opacity: 0.8;">Profile</span>
        </div>
        <div class="nav-actions">
            <button onclick="window.history.back()">←</button>
            <button onclick="logout()">🚪</button>
        </div>
    </nav>
    
    <div class="container" style="max-width: 800px;">
        <div id="profileContent">
            <div class="loading-state"><div class="spinner"></div><p>Loading profile...</p></div>
        </div>
    </div>
    
    <script src="js/firebase-config.js"></script>
    <script src="js/app.js"></script>
    <script>
        // ============================================
        // PROFILE DETAIL PAGE
        // ============================================
        
        async function initProfileDetailPage() {
            const user = auth.currentUser;
            if (!user) {
                document.getElementById('profileContent').innerHTML = `
                    <div class="card" style="text-align: center; padding: 20px;">
                        <p>Please login to view profiles</p>
                        <button class="btn btn-primary" onclick="window.location.href='index.html'">Login</button>
                    </div>
                `;
                return;
            }
            
            // Get the email from URL parameters
            const params = getUrlParams();
            const email = params.email || params.profileEmail;
            
            console.log('🔍 Profile Detail - Email from URL:', email);
            
            if (!email) {
                document.getElementById('profileContent').innerHTML = `
                    <div class="card" style="text-align: center; padding: 20px; color: var(--error);">
                        <div style="font-size: 48px; margin-bottom: 8px;">❌</div>
                        <h3>No Profile Specified</h3>
                        <p style="color: var(--text-secondary);">Please go back and select a profile</p>
                        <button class="btn btn-primary" onclick="window.history.back()" style="margin-top: 12px;">Go Back</button>
                    </div>
                `;
                return;
            }
            
            const docId = emailToDocumentId(email);
            console.log('🔍 Looking for profile with document ID:', docId);
            
            const container = document.getElementById('profileContent');
            container.innerHTML = '<div class="loading-state"><div class="spinner"></div><p>Loading profile...</p></div>';
            
            try {
                const doc = await db.collection('profiles').doc(docId).get();
                
                if (!doc.exists) {
                    container.innerHTML = `
                        <div class="card" style="text-align: center; padding: 20px;">
                            <div style="font-size: 48px; margin-bottom: 8px;">👤</div>
                            <h3>Profile Not Found</h3>
                            <p style="color: var(--text-secondary);">This profile does not exist or has been removed</p>
                            <button class="btn btn-primary" onclick="window.history.back()" style="margin-top: 12px;">Go Back</button>
                        </div>
                    `;
                    return;
                }
                
                const profile = { id: doc.id, ...doc.data() };
                console.log('✅ Profile loaded:', profile['First Name'], profile['Last Name']);
                
                const status = profile['Profile Status'] || 'PENDING';
                const isApproved = status === 'APPROVED';
                const isRejected = status === 'REJECTED';
                
                if (isRejected) {
                    container.innerHTML = `
                        <div class="card" style="text-align: center; padding: 20px;">
                            <div style="font-size: 48px; margin-bottom: 8px;">🚫</div>
                            <h3>Profile Rejected</h3>
                            <p style="color: var(--text-secondary);">This profile has been rejected by the admin</p>
                            <button class="btn btn-primary" onclick="window.history.back()" style="margin-top: 12px;">Go Back</button>
                        </div>
                    `;
                    return;
                }
                
                if (!isApproved) {
                    container.innerHTML = `
                        <div class="card" style="text-align: center; padding: 20px;">
                            <div style="font-size: 48px; margin-bottom: 8px;">⏳</div>
                            <h3>Profile Pending Approval</h3>
                            <p style="color: var(--text-secondary);">This profile is waiting for admin approval</p>
                            <button class="btn btn-primary" onclick="window.history.back()" style="margin-top: 12px;">Go Back</button>
                        </div>
                    `;
                    return;
                }
                
                // Check if current user is admin
                const isAdminUser = await isAdmin();
                const currentUserEmail = user.email;
                const isOwnProfile = currentUserEmail === email;
                
                // Check if in favorites
                const currentEmailKey = getCurrentUserEmailKey();
                let isFavorite = false;
                if (currentEmailKey && currentEmailKey !== docId && !isOwnProfile) {
                    try {
                        const favDoc = await db.collection('shortlist').doc(`${currentEmailKey}-${docId}`).get();
                        isFavorite = favDoc.exists;
                    } catch (e) {
                        console.warn('Error checking favorite:', e);
                    }
                }
                
                container.innerHTML = createProfileDetailHTML(profile, isOwnProfile, isAdminUser, isFavorite, docId);
                
            } catch (error) {
                console.error('❌ Error loading profile:', error);
                container.innerHTML = `
                    <div class="card" style="text-align: center; padding: 20px; color: var(--error);">
                        <div style="font-size: 48px; margin-bottom: 8px;">❌</div>
                        <h3>Error Loading Profile</h3>
                        <p style="color: var(--text-secondary);">${error.message}</p>
                        <button class="btn btn-primary" onclick="initProfileDetailPage()" style="margin-top: 12px;">Retry</button>
                        <button class="btn btn-outline" onclick="window.history.back()" style="margin-top: 12px;">Go Back</button>
                    </div>
                `;
            }
        }
        
        // ============================================
        // CREATE PROFILE DETAIL HTML
        // ============================================
        
        function createProfileDetailHTML(profile, isOwnProfile, isAdmin, isFavorite, docId) {
            const name = `${profile['First Name'] || ''} ${profile['Last Name'] || ''}`.trim() || 'Unknown';
            const age = profile.Age || '?';
            const gender = profile.Gender || '';
            const city = profile.City || '';
            const state = profile.State || '';
            const education = profile.Education || '';
            const specialization = profile.Specialization || '';
            const college = profile.College || '';
            const occupation = profile.Occupation || '';
            const company = profile.Company || '';
            const annualIncome = profile['Annual Income'] || '';
            const workLocation = profile['Work Location'] || '';
            const community = profile.Community || '';
            const subCommunity = profile['Sub Community'] || '';
            const maritalStatus = profile['Marital Status'] || '';
            const motherTongue = profile['Mother Tongue'] || '';
            const height = profile['Height (cm)'] || 0;
            const weight = profile['Weight (kg)'] || 0;
            const familyType = profile['Family Type'] || '';
            const familyStatus = profile['Family Status'] || '';
            const fatherName = profile['Father Name'] || '';
            const fatherOccupation = profile['Father Occupation'] || '';
            const motherName = profile['Mother Name'] || '';
            const motherOccupation = profile['Mother Occupation'] || '';
            const brothers = profile.Brothers || 0;
            const sisters = profile.Sisters || 0;
            const nativePlace = profile['Native Place'] || '';
            const photo = profile['Profile Photo'] || '';
            const gallery = profile.galleryImages || [];
            const phone = profile.Phone || '';
            const email = profile.email || '';
            const rashi = profile.Rashi || '';
            const nakshatra = profile.Nakshatra || '';
            const mangal = profile.Mangal || '';
            const status = profile['Profile Status'] || 'PENDING';
            
            // Partner preferences
            const expectedAgeFrom = profile['Expected Age From'] || 0;
            const expectedAgeTo = profile['Expected Age To'] || 0;
            const expectedHeightFrom = profile['Expected Height From (cm)'] || 0;
            const expectedHeightTo = profile['Expected Height To (cm)'] || 0;
            const preferredEducation = profile['Preferred Education'] || [];
            const preferredCities = profile['Preferred Cities'] || [];
            const preferredOccupations = profile['Preferred Occupations'] || [];
            const incomeExpectation = profile['Income Expectation'] || '';
            const acceptDivorce = profile['Accept Divorce'] || '';
            
            const photoHTML = photo ? 
                `<img src="${photo}" alt="${name}" style="width: 150px; height: 150px; border-radius: 50%; object-fit: cover; border: 4px solid var(--primary);">` :
                `<div style="width: 150px; height: 150px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-size: 56px; font-weight: 700;">${name.charAt(0).toUpperCase()}</div>`;
            
            const statusColor = status === 'APPROVED' ? 'var(--success)' : 'var(--warning)';
            const statusText = status === 'APPROVED' ? '✅ Verified Profile' : '⏳ Pending Approval';
            
            let html = `
                <div style="display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 16px 0;">
                    ${photoHTML}
                    <h1 style="margin: 0; font-size: 28px;">${name}</h1>
                    <div style="display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;">
                        <span class="tag" style="background: ${statusColor}20; color: ${statusColor}; padding: 4px 12px; border-radius: 16px; font-weight: 500;">${statusText}</span>
                        ${gender ? `<span class="tag">${gender}</span>` : ''}
                        ${community ? `<span class="tag">${community}</span>` : ''}
                        ${age ? `<span class="tag">${age} years</span>` : ''}
                    </div>
                    ${city ? `<p style="color: var(--text-secondary); font-size: 16px;">📍 ${city}${state ? ', ' + state : ''}</p>` : ''}
                    
                    ${!isOwnProfile && !isAdmin ? `
                        <div style="display: flex; gap: 8px;">
                            <button class="btn ${isFavorite ? 'btn-danger' : 'btn-primary'}" onclick="toggleFavorite('${docId}')">
                                ${isFavorite ? '❤️ Remove from Favorites' : '🤍 Add to Favorites'}
                            </button>
                        </div>
                    ` : ''}
                    
                    ${isOwnProfile ? `
                        <div style="display: flex; gap: 8px;">
                            <button class="btn btn-primary" onclick="window.location.href='edit-profile.html'">✏️ Edit Profile</button>
                            <button class="btn btn-secondary" onclick="window.location.href='gallery-management.html?docId=${docId}'">📸 Manage Gallery</button>
                        </div>
                    ` : ''}
                </div>
            `;
            
            // Sections
            const sections = [];
            
            // Basic Info
            let basicInfo = [];
            if (age) basicInfo.push({ label: 'Age', value: age + ' years' });
            if (gender) basicInfo.push({ label: 'Gender', value: gender });
            if (height) basicInfo.push({ label: 'Height', value: height + ' cm' });
            if (weight) basicInfo.push({ label: 'Weight', value: weight + ' kg' });
            if (maritalStatus) basicInfo.push({ label: 'Marital Status', value: maritalStatus });
            if (motherTongue) basicInfo.push({ label: 'Mother Tongue', value: motherTongue });
            if (community) basicInfo.push({ label: 'Community', value: community });
            if (subCommunity) basicInfo.push({ label: 'Sub Community', value: subCommunity });
            if (city) basicInfo.push({ label: 'City', value: city });
            if (state) basicInfo.push({ label: 'State', value: state });
            
            if (basicInfo.length > 0) {
                sections.push({
                    title: '📋 Basic Details',
                    items: basicInfo
                });
            }
            
            // Education & Career
            let eduCareer = [];
            if (education) eduCareer.push({ label: 'Education', value: education });
            if (specialization) eduCareer.push({ label: 'Specialization', value: specialization });
            if (college) eduCareer.push({ label: 'College', value: college });
            if (occupation) eduCareer.push({ label: 'Occupation', value: occupation });
            if (company) eduCareer.push({ label: 'Company', value: company });
            if (annualIncome) eduCareer.push({ label: 'Annual Income', value: annualIncome });
            if (workLocation) eduCareer.push({ label: 'Work Location', value: workLocation });
            
            if (eduCareer.length > 0) {
                sections.push({
                    title: '🎓 Education & Career',
                    items: eduCareer
                });
            }
            
            // Family
            let family = [];
            if (familyType) family.push({ label: 'Family Type', value: familyType });
            if (familyStatus) family.push({ label: 'Family Status', value: familyStatus });
            if (fatherName) family.push({ label: 'Father', value: fatherName });
            if (fatherOccupation) family.push({ label: "Father's Occupation", value: fatherOccupation });
            if (motherName) family.push({ label: 'Mother', value: motherName });
            if (motherOccupation) family.push({ label: "Mother's Occupation", value: motherOccupation });
            if (brothers > 0 || sisters > 0) {
                family.push({ label: 'Siblings', value: `${brothers} Brothers, ${sisters} Sisters` });
            }
            if (nativePlace) family.push({ label: 'Native Place', value: nativePlace });
            
            if (family.length > 0) {
                sections.push({
                    title: '👨‍👩‍👧‍👦 Family Details',
                    items: family
                });
            }
            
            // Partner Preferences
            let partner = [];
            if (expectedAgeFrom > 0 || expectedAgeTo > 0) {
                partner.push({ label: 'Expected Age', value: `${expectedAgeFrom || 0} - ${expectedAgeTo || 0}` });
            }
            if (expectedHeightFrom > 0 || expectedHeightTo > 0) {
                partner.push({ label: 'Expected Height', value: `${expectedHeightFrom || 0} - ${expectedHeightTo || 0} cm` });
            }
            if (preferredEducation && preferredEducation.length > 0) {
                partner.push({ label: 'Preferred Education', value: preferredEducation.join(', ') });
            }
            if (preferredCities && preferredCities.length > 0) {
                partner.push({ label: 'Preferred Cities', value: preferredCities.join(', ') });
            }
            if (preferredOccupations && preferredOccupations.length > 0) {
                partner.push({ label: 'Preferred Occupations', value: preferredOccupations.join(', ') });
            }
            if (incomeExpectation) partner.push({ label: 'Income Expectation', value: incomeExpectation });
            if (acceptDivorce) partner.push({ label: 'Accept Divorce', value: acceptDivorce });
            
            if (partner.length > 0) {
                sections.push({
                    title: '💑 Partner Preferences',
                    items: partner
                });
            }
            
            // Horoscope
            let horoscope = [];
            if (rashi) horoscope.push({ label: 'Rashi', value: rashi });
            if (nakshatra) horoscope.push({ label: 'Nakshatra', value: nakshatra });
            if (mangal) horoscope.push({ label: 'Mangal', value: mangal });
            
            if (horoscope.length > 0) {
                sections.push({
                    title: '🌟 Horoscope',
                    items: horoscope
                });
            }
            
            // Render sections
            sections.forEach(section => {
                html += `
                    <div class="card" style="margin-top: 12px;">
                        <h4 style="margin-bottom: 12px;">${section.title}</h4>
                        ${section.items.map(item => `
                            <div style="display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #f0f0f0;">
                                <span style="color: var(--text-secondary);">${item.label}</span>
                                <span style="font-weight: 500;">${item.value}</span>
                            </div>
                        `).join('')}
                    </div>
                `;
            });
            
            // Gallery
            if (gallery.length > 0) {
                html += `
                    <div class="card" style="margin-top: 12px;">
                        <h4 style="margin-bottom: 12px;">📸 Gallery Photos (${gallery.length})</h4>
                        <div class="gallery-grid">
                            ${gallery.map(img => `
                                <div class="gallery-item">
                                    <img src="${img}" alt="Gallery photo" onerror="this.style.display='none'">
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
            
            // Contact - Show for admin, own profile, or unlocked
            const showContact = isAdmin || isOwnProfile;
            
            if (showContact && (phone || email)) {
                html += `
                    <div class="card" style="margin-top: 12px;">
                        <h4 style="margin-bottom: 12px;">📞 Contact</h4>
                        ${phone ? `<div style="display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #f0f0f0;"><span style="color: var(--text-secondary);">Phone</span><span style="font-weight: 500;">${phone}</span></div>` : ''}
                        ${email ? `<div style="display: flex; justify-content: space-between; padding: 4px 0;"><span style="color: var(--text-secondary);">Email</span><span style="font-weight: 500;">${email}</span></div>` : ''}
                        ${isAdmin ? `<div style="margin-top: 8px; font-size: 12px; color: var(--success);">👑 Admin Access - Contact visible</div>` : ''}
                    </div>
                `;
            } else if (!showContact && (phone || email)) {
                html += `
                    <div class="card" style="margin-top: 12px; text-align: center; padding: 20px;">
                        <div style="font-size: 32px; margin-bottom: 4px;">🔒</div>
                        <h4>Contact Locked</h4>
                        <p style="color: var(--text-secondary); font-size: 14px;">Unlock to view phone and email</p>
                        <button class="btn btn-primary" onclick="showToast('Contact unlock feature coming soon', 'info')">
                            🔓 Unlock Contact (₹99)
                        </button>
                    </div>
                `;
            }
            
            return html;
        }
        
        // ============================================
        // TOGGLE FAVORITE
        // ============================================
        
        async function toggleFavorite(profileId) {
            const emailKey = getCurrentUserEmailKey();
            if (!emailKey) {
                showToast('Please login to add favorites', 'warning');
                return;
            }
            
            const docId = `${emailKey}-${profileId}`;
            
            try {
                const doc = await db.collection('shortlist').doc(docId).get();
                
                if (doc.exists) {
                    await db.collection('shortlist').doc(docId).delete();
                    showToast('Removed from favorites', 'info');
                } else {
                    await db.collection('shortlist').doc(docId).set({
                        userId: emailKey,
                        profileId: profileId,
                        createdAt: Date.now()
                    });
                    showToast('Added to favorites! ❤️', 'success');
                }
                
                // Refresh page
                initProfileDetailPage();
            } catch (error) {
                console.error('Error toggling favorite:', error);
                showToast('Error: ' + error.message, 'error');
            }
        }
        
        // ============================================
        // INITIALIZE
        // ============================================
        
        document.addEventListener('DOMContentLoaded', function() {
            // Check auth state
            auth.onAuthStateChanged(user => {
                if (user) {
                    initProfileDetailPage();
                } else {
                    document.getElementById('profileContent').innerHTML = `
                        <div class="card" style="text-align: center; padding: 20px;">
                            <p>Please login to view profiles</p>
                            <button class="btn btn-primary" onclick="window.location.href='index.html'">Login</button>
                        </div>
                    `;
                }
            });
        });
        
        // Expose for inline use
        window.toggleFavorite = toggleFavorite;
        window.initProfileDetailPage = initProfileDetailPage;
    </script>
</body>
</html>
