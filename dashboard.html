<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bandhan - Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <!-- Cloudinary Upload Widget -->
    <script src="https://upload-widget.cloudinary.com/latest/global.js"></script>
</head>
<body>
    <!-- Top Navigation -->
    <nav class="top-nav">
        <div class="brand">
            <span>बंधन</span>
            <span style="font-weight: normal; font-size: 14px; opacity: 0.8;">Matrimony</span>
        </div>
        <div class="nav-actions">
            <button onclick="window.location.href='profile-detail.html'" title="My Profile">👤</button>
            <button onclick="logout()" title="Logout">🚪</button>
        </div>
    </nav>
    
    <!-- Tab Navigation -->
    <nav class="tab-nav" id="tabNav">
        <a class="tab-item active" data-tab="home" onclick="showTab('home')">🏠 Home</a>
        <a class="tab-item" data-tab="search" onclick="showTab('search')">🔍 Search</a>
        <a class="tab-item" data-tab="favorites" onclick="showTab('favorites')">❤️ Favorites</a>
        <a class="tab-item" data-tab="profile" onclick="showTab('profile')">👤 My Profile</a>
    </nav>
    
    <!-- Tab Content -->
    <div class="container">
        <!-- HOME TAB -->
        <div class="tab-content active" id="tab-home">
            <div id="homeContent">
                <!-- Dynamic content -->
            </div>
        </div>
        
        <!-- SEARCH TAB -->
        <div class="tab-content" id="tab-search">
            <div class="card" style="text-align: center; padding: 40px;">
                <div style="font-size: 48px; margin-bottom: 8px;">🔍</div>
                <h3>Search Profiles</h3>
                <p style="color: var(--text-secondary);">Filter by city, age, community, and more</p>
                <div style="margin-top: 16px; max-width: 400px; margin-left: auto; margin-right: auto;">
                    <div class="form-group">
                        <input type="text" id="searchInput" class="form-control" placeholder="Search by name, city, community...">
                    </div>
                    <button class="btn btn-primary" onclick="performSearch()">Search</button>
                </div>
                <div id="searchResults" style="margin-top: 16px;"></div>
            </div>
        </div>
        
        <!-- FAVORITES TAB -->
        <div class="tab-content" id="tab-favorites">
            <div id="favoritesContent">
                <!-- Dynamic content -->
            </div>
        </div>
        
        <!-- PROFILE TAB -->
        <div class="tab-content" id="tab-profile">
            <div id="profileContent">
                <!-- Dynamic content -->
            </div>
        </div>
    </div>
    
    <!-- Global Loader - FIXED: Removed inline display:flex -->
    <div id="globalLoader" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.8); z-index: 9999; align-items: center; justify-content: center;">
        <div class="spinner"></div>
    </div>
    
    <script src="js/firebase-config.js"></script>
    <script src="js/app.js"></script>
    <script>
        // ============================================
        // DASHBOARD INITIALIZATION
        // ============================================
        
        let isInitialized = false;
        
        // ===== SHOW/HIDE LOADER =====
        function showLoader(show) {
            const loader = document.getElementById('globalLoader');
            if (loader) {
                if (show) {
                    loader.style.display = 'flex';
                } else {
                    loader.style.display = 'none';
                }
            }
        }
        
        // ===== INIT DASHBOARD =====
        async function initDashboardPage() {
            if (isInitialized) return;
            isInitialized = true;
            
            const user = auth.currentUser;
            if (!user) {
                console.log('No user found, redirecting to login');
                window.location.href = 'index.html';
                return;
            }
            
            console.log('✅ Dashboard initialized for:', user.email);
            
            // Show loader while loading
            showLoader(true);
            
            try {
                // Check if user has profile
                const emailKey = getCurrentUserEmailKey();
                const profile = await getUserProfile(emailKey);
                
                if (!profile) {
                    // No profile, show create profile option in home tab
                    document.getElementById('homeContent').innerHTML = `
                        <div class="card" style="text-align: center; padding: 40px;">
                            <div style="font-size: 48px; margin-bottom: 8px;">📝</div>
                            <h3>Create Your Profile</h3>
                            <p style="color: var(--text-secondary);">Complete your matrimony profile to get started</p>
                            <button class="btn btn-primary" onclick="window.location.href='create-profile.html'" style="margin-top: 16px;">
                                Create Profile
                            </button>
                        </div>
                    `;
                }
                
                // Load all sections
                await Promise.all([
                    loadHomeProfiles(),
                    loadFavorites(),
                    loadMyProfile()
                ]);
                
                console.log('✅ Dashboard fully loaded');
                
            } catch (error) {
                console.error('Error initializing dashboard:', error);
                showToast('Error loading dashboard: ' + error.message, 'error');
            } finally {
                // Hide loader after everything is loaded
                showLoader(false);
            }
        }
        
        // ===== LOAD HOME PROFILES =====
        async function loadHomeProfiles() {
            const container = document.getElementById('homeContent');
            container.innerHTML = '<div class="loading-state"><div class="spinner"></div><p>Loading profiles...</p></div>';
            
            try {
                const emailKey = getCurrentUserEmailKey();
                
                // Get user's gender to filter
                let targetGender = null;
                const profileDoc = await db.collection('profiles').doc(emailKey).get();
                if (profileDoc.exists) {
                    const profile = profileDoc.data();
                    const userGender = (profile.Gender || '').toLowerCase();
                    if (userGender === 'male') targetGender = 'Female';
                    else if (userGender === 'female') targetGender = 'Male';
                }
                
                // Query profiles
                let query = db.collection('profiles').where('Profile Status', '==', 'APPROVED');
                if (targetGender) {
                    query = query.where('Gender', '==', targetGender);
                }
                
                const snapshot = await query.limit(50).get();
                
                if (snapshot.empty) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">👤</div>
                            <h4>No profiles available</h4>
                            <p style="color: var(--text-secondary);">Check back later for new profiles</p>
                        </div>
                    `;
                    return;
                }
                
                let html = '<div style="display: flex; flex-direction: column; gap: 12px;">';
                snapshot.forEach(doc => {
                    const p = { id: doc.id, ...doc.data() };
                    html += createProfileCardHTML(p);
                });
                html += '</div>';
                container.innerHTML = html;
                
            } catch (error) {
                console.error('Error loading profiles:', error);
                container.innerHTML = `
                    <div class="card" style="text-align: center; padding: 20px; color: var(--error);">
                        <p>Error loading profiles: ${error.message}</p>
                        <button class="btn btn-primary" onclick="loadHomeProfiles()" style="margin-top: 8px;">Retry</button>
                    </div>
                `;
            }
        }
        
        // ===== CREATE PROFILE CARD HTML =====
        function createProfileCardHTML(profile) {
            const name = `${profile['First Name'] || ''} ${profile['Last Name'] || ''}`.trim() || 'Unknown';
            const age = profile.Age || '?';
            const city = profile.City || '';
            const state = profile.State || '';
            const education = profile.Education || '';
            const occupation = profile.Occupation || '';
            const community = profile.Community || '';
            const gender = profile.Gender || '';
            const photo = profile['Profile Photo'] || '';
            const email = profile.email || '';
            
            const photoHTML = photo ? 
                `<img src="${photo}" alt="${name}" class="avatar" onerror="this.src=''">` :
                `<div class="avatar-placeholder">${name.charAt(0).toUpperCase()}</div>`;
            
            const detailUrl = `profile-detail.html?email=${encodeURIComponent(email)}`;
            
            return `
                <div class="card profile-card" onclick="window.location.href='${detailUrl}'">
                    ${photoHTML}
                    <div class="info">
                        <div class="name">${name}, ${age}</div>
                        <div class="details">
                            ${city ? `<span>📍 ${city}${state ? ', ' + state : ''}</span>` : ''}
                            ${education ? `<span>🎓 ${education}</span>` : ''}
                            ${occupation ? `<span>💼 ${occupation}</span>` : ''}
                            ${community ? `<span class="tag">${community}</span>` : ''}
                            ${gender ? `<span class="tag">${gender}</span>` : ''}
                        </div>
                    </div>
                    <div class="actions">
                        <button onclick="event.stopPropagation(); window.location.href='${detailUrl}'" title="View Profile">👁️</button>
                    </div>
                </div>
            `;
        }
        
        // ===== LOAD FAVORITES =====
        async function loadFavorites() {
            const container = document.getElementById('favoritesContent');
            const emailKey = getCurrentUserEmailKey();
            
            if (!emailKey) {
                container.innerHTML = '<div class="empty-state"><div class="icon">❤️</div><h4>Please login to view favorites</h4></div>';
                return;
            }
            
            container.innerHTML = '<div class="loading-state"><div class="spinner"></div><p>Loading favorites...</p></div>';
            
            try {
                const shortlistSnapshot = await db.collection('shortlist')
                    .where('userId', '==', emailKey)
                    .get();
                
                if (shortlistSnapshot.empty) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">❤️</div>
                            <h4>No Favorites Yet</h4>
                            <p style="color: var(--text-secondary);">Start adding profiles to your favorites!</p>
                            <button class="btn btn-primary" onclick="showTab('home')" style="margin-top: 12px;">Browse Profiles</button>
                        </div>
                    `;
                    return;
                }
                
                // Get all profile IDs
                const profileIds = [];
                shortlistSnapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.profileId) profileIds.push(data.profileId);
                });
                
                if (profileIds.length === 0) {
                    container.innerHTML = '<div class="empty-state"><div class="icon">❤️</div><h4>No favorites found</h4></div>';
                    return;
                }
                
                // Fetch profiles
                let html = `<h3 style="margin-bottom: 12px;">❤️ Your Favorites (${profileIds.length})</h3>`;
                html += '<div style="display: flex; flex-direction: column; gap: 12px;">';
                
                for (const pid of profileIds) {
                    try {
                        const doc = await db.collection('profiles').doc(pid).get();
                        if (doc.exists) {
                            const p = { id: pid, ...doc.data() };
                            html += createProfileCardHTML(p);
                        }
                    } catch (e) {
                        console.warn('Error loading profile:', pid, e);
                    }
                }
                
                html += '</div>';
                container.innerHTML = html;
                
            } catch (error) {
                console.error('Error loading favorites:', error);
                container.innerHTML = `
                    <div class="card" style="text-align: center; padding: 20px; color: var(--error);">
                        <p>Error loading favorites: ${error.message}</p>
                    </div>
                `;
            }
        }
        
        // ===== LOAD MY PROFILE =====
        async function loadMyProfile() {
            const container = document.getElementById('profileContent');
            const emailKey = getCurrentUserEmailKey();
            
            if (!emailKey) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">👤</div>
                        <h4>Please login to view your profile</h4>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = '<div class="loading-state"><div class="spinner"></div><p>Loading profile...</p></div>';
            
            try {
                const doc = await db.collection('profiles').doc(emailKey).get();
                
                if (!doc.exists) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">📝</div>
                            <h4>No Profile Found</h4>
                            <p style="color: var(--text-secondary);">Create your matrimony profile</p>
                            <button class="btn btn-primary" onclick="window.location.href='create-profile.html'" style="margin-top: 12px;">
                                Create Profile
                            </button>
                        </div>
                    `;
                    return;
                }
                
                const profile = { id: doc.id, ...doc.data() };
                container.innerHTML = createMyProfileHTML(profile);
                
            } catch (error) {
                console.error('Error loading profile:', error);
                container.innerHTML = `
                    <div class="card" style="text-align: center; padding: 20px; color: var(--error);">
                        <p>Error loading profile: ${error.message}</p>
                    </div>
                `;
            }
        }
        
        function createMyProfileHTML(profile) {
            const name = `${profile['First Name'] || ''} ${profile['Last Name'] || ''}`.trim() || 'Unknown';
            const age = profile.Age || '?';
            const gender = profile.Gender || '';
            const city = profile.City || '';
            const state = profile.State || '';
            const education = profile.Education || '';
            const occupation = profile.Occupation || '';
            const community = profile.Community || '';
            const photo = profile['Profile Photo'] || '';
            const status = profile['Profile Status'] || 'PENDING';
            const phone = profile.Phone || '';
            const email = profile.email || '';
            const gallery = profile.galleryImages || [];
            
            const isApproved = status === 'APPROVED';
            const statusColor = isApproved ? 'var(--success)' : 'var(--warning)';
            const statusText = isApproved ? '✅ Verified Profile' : '⏳ Pending Approval';
            
            const photoHTML = photo ? 
                `<img src="${photo}" alt="${name}" style="width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 4px solid var(--primary);">` :
                `<div style="width: 120px; height: 120px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-size: 48px; font-weight: 700;">${name.charAt(0).toUpperCase()}</div>`;
            
            let html = `
                <div style="display: flex; flex-direction: column; align-items: center; gap: 16px;">
                    ${photoHTML}
                    <h2 style="margin: 0;">${name}</h2>
                    <div style="display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;">
                        <span class="tag" style="background: ${statusColor}20; color: ${statusColor}; padding: 4px 12px; border-radius: 16px; font-weight: 500;">${statusText}</span>
                        ${gender ? `<span class="tag">${gender}</span>` : ''}
                        ${community ? `<span class="tag">${community}</span>` : ''}
                    </div>
                    ${city ? `<p style="color: var(--text-secondary);">📍 ${city}${state ? ', ' + state : ''}</p>` : ''}
                </div>
            `;
            
            // Details card
            html += `
                <div class="card" style="margin-top: 16px;">
                    <h4 style="margin-bottom: 12px;">📋 Profile Details</h4>
                    ${createDetailRow('Age', age + ' years')}
                    ${createDetailRow('Gender', gender)}
                    ${createDetailRow('Education', education)}
                    ${createDetailRow('Occupation', occupation)}
                    ${createDetailRow('Community', community)}
                    ${createDetailRow('City', city)}
                    ${createDetailRow('Phone', phone)}
                    ${createDetailRow('Email', email)}
                </div>
            `;
            
            // Gallery
            if (gallery.length > 0) {
                html += `
                    <div class="card" style="margin-top: 12px;">
                        <h4 style="margin-bottom: 12px;">📸 Gallery Photos (${gallery.length})</h4>
                        <div class="gallery-grid">
                            ${gallery.map(img => `
                                <div class="gallery-item">
                                    <img src="${img}" alt="Gallery photo" onerror="this.style.display='none'">
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
            
            // Action buttons
            html += `
                <div style="display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap;">
                    <button class="btn btn-primary" onclick="window.location.href='edit-profile.html'">✏️ Edit Profile</button>
                    <button class="btn btn-secondary" onclick="window.location.href='gallery-management.html'">📸 Manage Gallery</button>
                    <button class="btn btn-outline" onclick="window.location.href='profile-detail.html?email=${encodeURIComponent(email)}'">👁️ View Public Profile</button>
                </div>
            `;
            
            return html;
        }
        
        function createDetailRow(label, value) {
            if (!value) return '';
            return `
                <div style="display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #f0f0f0;">
                    <span style="color: var(--text-secondary);">${label}</span>
                    <span style="font-weight: 500;">${value}</span>
                </div>
            `;
        }
        
        // ===== SEARCH FUNCTION =====
        async function performSearch() {
            const query = document.getElementById('searchInput').value.trim();
            const resultsContainer = document.getElementById('searchResults');
            
            if (!query) {
                resultsContainer.innerHTML = '<p style="color: var(--text-secondary);">Enter a search term</p>';
                return;
            }
            
            resultsContainer.innerHTML = '<div class="loading-state"><div class="spinner"></div><p>Searching...</p></div>';
            
            try {
                const snapshot = await db.collection('profiles')
                    .where('Profile Status', '==', 'APPROVED')
                    .limit(50)
                    .get();
                
                const results = [];
                snapshot.forEach(doc => {
                    const p = { id: doc.id, ...doc.data() };
                    const searchText = `${p['First Name'] || ''} ${p['Last Name'] || ''} ${p.City || ''} ${p.Community || ''}`.toLowerCase();
                    if (searchText.includes(query.toLowerCase())) {
                        results.push(p);
                    }
                });
                
                if (results.length === 0) {
                    resultsContainer.innerHTML = '<p style="color: var(--text-secondary);">No profiles found matching your search</p>';
                    return;
                }
                
                let html = `<p style="color: var(--text-secondary); margin-bottom: 8px;">Found ${results.length} profiles</p>`;
                html += '<div style="display: flex; flex-direction: column; gap: 12px;">';
                results.forEach(p => {
                    html += createProfileCardHTML(p);
                });
                html += '</div>';
                resultsContainer.innerHTML = html;
                
            } catch (error) {
                console.error('Search error:', error);
                resultsContainer.innerHTML = `<p style="color: var(--error);">Error: ${error.message}</p>`;
            }
        }
        
        // ===== TAB SWITCHING =====
        function showTab(tabName) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(el => {
                el.classList.remove('active');
            });
            document.querySelectorAll('.tab-item').forEach(el => {
                el.classList.remove('active');
            });
            
            // Show selected tab
            const tabContent = document.getElementById(`tab-${tabName}`);
            if (tabContent) tabContent.classList.add('active');
            
            const tabItem = document.querySelector(`.tab-item[data-tab="${tabName}"]`);
            if (tabItem) tabItem.classList.add('active');
        }
        
        // ===== ADD TO FAVORITES =====
        async function toggleFavorite(profileId) {
            const emailKey = getCurrentUserEmailKey();
            if (!emailKey) {
                showToast('Please login to add favorites', 'warning');
                return;
            }
            
            const docId = `${emailKey}-${profileId}`;
            
            try {
                const doc = await db.collection('shortlist').doc(docId).get();
                
                if (doc.exists) {
                    await db.collection('shortlist').doc(docId).delete();
                    showToast('Removed from favorites', 'info');
                } else {
                    await db.collection('shortlist').doc(docId).set({
                        userId: emailKey,
                        profileId: profileId,
                        createdAt: Date.now()
                    });
                    showToast('Added to favorites! ❤️', 'success');
                }
                
                // Refresh favorites
                await loadFavorites();
            } catch (error) {
                console.error('Error toggling favorite:', error);
                showToast('Error: ' + error.message, 'error');
            }
        }
        
        // ============================================
        // EXPOSE FUNCTIONS GLOBALLY
        // ============================================
        
        window.showTab = showTab;
        window.performSearch = performSearch;
        window.toggleFavorite = toggleFavorite;
        window.loadHomeProfiles = loadHomeProfiles;
        window.loadFavorites = loadFavorites;
        window.loadMyProfile = loadMyProfile;
        window.showLoader = showLoader;
        
        // ============================================
        // INITIALIZE - SINGLE AUTH CHECK
        // ============================================
        
        document.addEventListener('DOMContentLoaded', function() {
            console.log('📄 Dashboard page loaded');
            
            // Show loader initially
            showLoader(true);
            
            // Check auth state once
            const unsubscribe = auth.onAuthStateChanged(function(user) {
                console.log('🔥 Auth state changed:', user ? user.email : 'No user');
                
                if (user) {
                    // User is authenticated - initialize dashboard
                    initDashboardPage();
                } else {
                    // No user - redirect to login
                    console.log('No authenticated user, redirecting to login');
                    showLoader(false);
                    window.location.href = 'index.html';
                }
                
                // Clean up listener after first check
                unsubscribe();
            });
        });
    </script>
</body>
</html>
