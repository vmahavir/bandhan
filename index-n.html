<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bandhan - Login</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="container" style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
        <div class="card" style="max-width: 420px; width: 100%; padding: 40px; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); background: white;">
            <div style="text-align: center; margin-bottom: 32px;">
                <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border-radius: 12px; padding: 24px; margin-bottom: 20px;">
                    <h1 style="font-size: 32px; margin: 0; font-weight: 700;">बंधन</h1>
                    <p style="margin: 4px 0 0; opacity: 0.9; font-size: 14px;">Matrimony</p>
                </div>
                <h2 style="margin: 0; font-size: 24px; color: #333;">Welcome Back</h2>
                <p style="margin: 4px 0 0; color: #888; font-size: 14px;">Sign in to continue</p>
            </div>
            
            <!-- Login Form -->
            <div id="loginForm">
                <div id="loginError" style="color: #e74c3c; font-size: 14px; margin-bottom: 16px; display: none; background: #fde8e8; padding: 12px; border-radius: 8px;"></div>
                
                <div class="form-group">
                    <label for="loginEmail" style="display: block; margin-bottom: 6px; font-weight: 600; color: #555; font-size: 14px;">Email Address</label>
                    <input type="email" id="loginEmail" class="form-control" placeholder="your@email.com" value="vmahavir@gmail.com" style="width: 100%; padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 15px; transition: border-color 0.3s;">
                </div>
                
                <div class="form-group" style="margin-top: 16px;">
                    <label for="loginPassword" style="display: block; margin-bottom: 6px; font-weight: 600; color: #555; font-size: 14px;">Password</label>
                    <input type="password" id="loginPassword" class="form-control" placeholder="Enter your password" style="width: 100%; padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 15px; transition: border-color 0.3s;">
                </div>
                
                <div class="form-group" style="margin-top: 12px; display: flex; align-items: center; gap: 10px;">
                    <input type="checkbox" id="stayLoggedIn" checked style="width: 18px; height: 18px; accent-color: #667eea;">
                    <label for="stayLoggedIn" style="margin: 0; font-weight: normal; color: #555; font-size: 14px; cursor: pointer;">Keep me logged in</label>
                </div>
                
                <button id="loginBtn" class="btn btn-primary" style="width: 100%; padding: 14px; font-size: 16px; font-weight: 600; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 8px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; margin-top: 20px;">
                    Sign In
                </button>
                
                <p style="text-align: center; margin-top: 20px; color: #666; font-size: 14px;">
                    Don't have an account? 
                    <a href="register.html" style="color: #667eea; text-decoration: none; font-weight: 600;">Create Account</a>
                </p>
            </div>
        </div>
    </div>
    
    <!-- Load Firebase config first -->
    <script src="js/firebase-config.js"></script>
    
    <script>
        // ============================================
        // Firebase is already initialized in firebase-config.js
        // ============================================
        
        // ============================================
        // HELPER FUNCTIONS
        // ============================================
        
        function emailToDocumentId(email) {
            if (!email) return '';
            return email.replace(/[@.]/g, '_').toLowerCase();
        }
        
        function getSavedEmail() {
            const localEmail = localStorage.getItem('bandhan_email');
            if (localEmail) return localEmail;
            const sessionEmail = sessionStorage.getItem('bandhan_temp_session');
            if (sessionEmail) return sessionEmail;
            return null;
        }
        
        function clearSession() {
            localStorage.removeItem('bandhan_email');
            localStorage.removeItem('bandhan_stay_logged_in');
            sessionStorage.removeItem('bandhan_temp_session');
        }
        
        // ============================================
        // DOM ELEMENTS
        // ============================================
        
        const emailInput = document.getElementById('loginEmail');
        const passwordInput = document.getElementById('loginPassword');
        const loginBtn = document.getElementById('loginBtn');
        const errorDiv = document.getElementById('loginError');
        const stayLoggedIn = document.getElementById('stayLoggedIn');
        const loginForm = document.getElementById('loginForm');
        
        // ============================================
        // FOCUS EFFECTS
        // ============================================
        
        document.querySelectorAll('.form-control').forEach(input => {
            input.addEventListener('focus', function() {
                this.style.borderColor = '#667eea';
                this.style.outline = 'none';
            });
            input.addEventListener('blur', function() {
                this.style.borderColor = '#e0e0e0';
            });
        });
        
        // ============================================
        // CREATE OR GET USER DOCUMENT
        // ============================================
        
        async function createOrGetUserDocument(user) {
            const emailKey = emailToDocumentId(user.email);
            
            try {
                const userDoc = await db.collection('users').doc(emailKey).get();
                
                if (userDoc.exists) {
                    return userDoc.data();
                } else {
                    const userData = {
                        email: user.email,
                        role: 'USER',
                        accountStatus: 'ACTIVE',
                        displayName: user.displayName || user.email.split('@')[0],
                        createdAt: Date.now(),
                        lastLogin: Date.now(),
                        emailVerified: user.emailVerified || false
                    };
                    
                    await db.collection('users').doc(emailKey).set(userData);
                    return userData;
                }
            } catch (error) {
                console.error('Firestore error:', error);
                return {
                    email: user.email,
                    role: 'USER',
                    accountStatus: 'ACTIVE'
                };
            }
        }
        
        // ============================================
        // HANDLE AUTHENTICATED USER
        // ============================================
        
        let hasRedirected = false;
        
        async function handleAuthenticatedUser(user) {
            if (hasRedirected) return;
            hasRedirected = true;
            
            try {
                // Save session
                if (stayLoggedIn.checked) {
                    localStorage.setItem('bandhan_email', user.email);
                    localStorage.setItem('bandhan_stay_logged_in', 'true');
                    sessionStorage.removeItem('bandhan_temp_session');
                } else {
                    sessionStorage.setItem('bandhan_temp_session', user.email);
                    localStorage.removeItem('bandhan_email');
                    localStorage.removeItem('bandhan_stay_logged_in');
                }
                
                // Get or create user document
                const userData = await createOrGetUserDocument(user);
                
                if (userData.accountStatus === 'INACTIVE') {
                    await auth.signOut();
                    clearSession();
                    hasRedirected = false;
                    errorDiv.textContent = 'Your account has been deactivated. Please contact admin.';
                    errorDiv.style.display = 'block';
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Sign In';
                    return;
                }
                
                // Redirect based on role
                const role = userData.role || 'USER';
                if (role === 'ADMIN') {
                    window.location.href = 'admin.html';
                } else {
                    window.location.href = 'dashboard.html';
                }
                
            } catch (error) {
                console.error('Error handling authenticated user:', error);
                hasRedirected = false;
                errorDiv.textContent = 'Error: ' + error.message;
                errorDiv.style.display = 'block';
                loginBtn.disabled = false;
                loginBtn.textContent = 'Sign In';
            }
        }
        
        // ============================================
        // INITIALIZE
        // ============================================
        
        document.addEventListener('DOMContentLoaded', function() {
            // Restore saved email
            const savedEmail = getSavedEmail();
            const stayLoggedInPref = localStorage.getItem('bandhan_stay_logged_in');
            
            if (savedEmail && stayLoggedInPref === 'true') {
                emailInput.value = savedEmail;
                stayLoggedIn.checked = true;
            }
            
            // Listen for auth state changes
            const unsubscribe = auth.onAuthStateChanged(function(user) {
                if (user) {
                    const stayLoggedInPref = localStorage.getItem('bandhan_stay_logged_in');
                    
                    if (stayLoggedInPref === 'false') {
                        auth.signOut().then(() => {
                            clearSession();
                        });
                        return;
                    }
                    
                    handleAuthenticatedUser(user);
                }
            });
            
            // Clean up listener on page unload
            window.addEventListener('beforeunload', function() {
                if (unsubscribe) unsubscribe();
            });
        });
        
        // ============================================
        // LOGIN BUTTON HANDLER
        // ============================================
        
        loginBtn.addEventListener('click', async function() {
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            
            // Clear previous errors
            errorDiv.style.display = 'none';
            errorDiv.textContent = '';
            
            // Validation
            if (!email) {
                errorDiv.textContent = 'Please enter your email address';
                errorDiv.style.display = 'block';
                emailInput.focus();
                return;
            }
            if (!password) {
                errorDiv.textContent = 'Please enter your password';
                errorDiv.style.display = 'block';
                passwordInput.focus();
                return;
            }
            if (password.length < 6) {
                errorDiv.textContent = 'Password must be at least 6 characters';
                errorDiv.style.display = 'block';
                passwordInput.focus();
                return;
            }
            
            // Disable button and show loading state
            loginBtn.disabled = true;
            loginBtn.textContent = 'Signing in...';
            
            try {
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const user = userCredential.user;
                
                // The onAuthStateChanged will handle the redirect
                // Set a fallback timeout
                setTimeout(() => {
                    if (!hasRedirected) {
                        // Save session before redirect
                        if (stayLoggedIn.checked) {
                            localStorage.setItem('bandhan_email', email);
                            localStorage.setItem('bandhan_stay_logged_in', 'true');
                        } else {
                            sessionStorage.setItem('bandhan_temp_session', email);
                            localStorage.removeItem('bandhan_stay_logged_in');
                        }
                        window.location.href = 'dashboard.html';
                    }
                }, 3000);
                
            } catch (error) {
                console.error('Login error:', error);
                
                let errorMessage = 'Login failed. Please try again.';
                if (error.code === 'auth/user-not-found') {
                    errorMessage = 'No account found with this email address.';
                } else if (error.code === 'auth/wrong-password') {
                    errorMessage = 'Incorrect password. Please try again.';
                } else if (error.code === 'auth/invalid-email') {
                    errorMessage = 'Please enter a valid email address.';
                } else if (error.code === 'auth/too-many-requests') {
                    errorMessage = 'Too many failed attempts. Please try again later.';
                } else if (error.code === 'auth/user-disabled') {
                    errorMessage = 'This account has been disabled. Please contact admin.';
                } else if (error.code === 'auth/network-request-failed') {
                    errorMessage = 'Network error. Please check your internet connection.';
                }
                
                errorDiv.textContent = errorMessage;
                errorDiv.style.display = 'block';
                loginBtn.disabled = false;
                loginBtn.textContent = 'Sign In';
            }
        });
        
        // ============================================
        // KEYBOARD SHORTCUTS
        // ============================================
        
        passwordInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                loginBtn.click();
            }
        });
        
        emailInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                passwordInput.focus();
            }
        });
    </script>
</body>
</html>
